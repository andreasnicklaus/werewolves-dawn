<h1 mat-dialog-title class="final__title">Victory for the {{ winnerTeamString }}</h1>
<div mat-dialog-content class="final">
  <ng-container
    *ngIf="
      data.roleAfterTheRound.friendly === data.winnerFriendly;
      then youWin;
      else youLose
    "
  ></ng-container>

  <ng-template #youWin>
    <p>You won as {{ data.roleAfterTheRound.name }}.</p>
  </ng-template>

  <ng-template #youLose>
    <p>You lost as {{ data.roleAfterTheRound.name }}.</p>
  </ng-template>
</div>

<mat-dialog-actions align="end">
  <button mat-raised-button color="primary" (click)="dialogRef.close()">
    Close
  </button>
</mat-dialog-actions>
