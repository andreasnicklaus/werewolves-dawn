<h1 mat-dialog-title>Name your host</h1>
<mat-dialog-content>
  <p class="dialog-lede">Choose the name your table will see.</p>
  <mat-form-field class="fullWidth">
    <mat-label>Your name</mat-label>
    <input matInput [(ngModel)]="data.name" name="name" autocomplete="name" />
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="closeDialog()" color="primary">
    Cancel
  </button>
  <button
    mat-raised-button
    (click)="start()"
    color="primary"
    [disabled]="!data.name.trim()"
  >
    Create room
  </button>
</mat-dialog-actions>
