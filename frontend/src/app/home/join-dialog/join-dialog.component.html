<h1 mat-dialog-title>Join a room</h1>
<div mat-dialog-content>
  <p class="dialog-lede">
    Enter your name and the room code your host shared.
  </p>
  <mat-form-field class="fullWidth">
    <mat-label>Your name</mat-label>
    <input matInput [(ngModel)]="data.name" name="name" autocomplete="name" />
  </mat-form-field>
  <mat-form-field class="fullWidth">
    <mat-label>Room code</mat-label>
    <input
      matInput
      [(ngModel)]="data.roomCode"
      name="roomCode"
      autocomplete="off"
      spellcheck="false"
    />
  </mat-form-field>
</div>
<mat-dialog-actions align="end">
  <button mat-stroked-button (click)="closeDialog()" color="primary">
    Cancel
  </button>
  <button
    mat-raised-button
    (click)="start()"
    color="primary"
    [disabled]="!data.name.trim() || !data.roomCode.trim()"
  >
    Join game
  </button>
</mat-dialog-actions>
